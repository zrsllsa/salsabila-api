services:
  - type: web
    name: about-salsabila-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Secret: isi lewat dashboard Render, jangan ditulis di file ini
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_ANON_KEY, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: SMTP_EMAIL, sync: false}
      - {key: SMTP_PASSWORD, sync: false}
      - {key: FRONTEND_URL, sync: false}
      - {key: BACKEND_URL, sync: false}
      - {key: CORS_ORIGINS, sync: false}
      - {key: COOKIE_SECURE, value: "true"}
      - {key: COOKIE_SAMESITE, value: none}
